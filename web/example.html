<!DOCTYPE html>
<html lang="en">
<head>
  <title>Open Map</title>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta name='description' content=''>
  <meta name="author" content="Patrick Brosi, University of Freiburg, Chair of Algorithms and Datastructures">
  <meta name="contact" content="brosi[at]cs.uni-freiburg.de">
  <meta name="viewport" content="initial-scale=1">
  <meta name="theme-color" content="#EEE">
  <meta property="og:title" content="QLever petrimaps">
  <meta property="og:description" content="QLever petrimaps">
  <link rel="stylesheet" href="build.css">
  <style>
    body {
      display: flex;
      justify-content: center;
    }

    .wrap {
      border-radius: 12px;
      width: 500px;
    }

    label {
      display: block;
      margin-bottom: 6px;
    }

    textarea {
      height: 280px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 6px;
      font-family: monospace;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border: none;
      background-color: default;
    }

    .tabs button {
      width: auto;
    }

    .tabs button.active {
      background-color: #ccc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>petrimaps integration example</h2>

    <form>
      <label>Requestor config JSON</label>

      <div class="tabs">
        <button type="button" class="active" onclick="showTab(0)">Various layers</button>
        <button type="button" onclick="showTab(1)">Object styles</button>
        <button type="button" onclick="showTab(2)">Checkboxes</button>
        <button type="button" onclick="showTab(3)">OSM export test</button>
      </div>

      <textarea class="config" id="config1" name="cfg">
{
  "query" : "PREFIX geo: <http://www.opengis.net/ont/geosparql#>\nPREFIX osm: <https://www.openstreetmap.org/>\nPREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\nPREFIX xsd: <http://www.w3.org/2001/XMLSchema#>\nPREFIX osmkey: <https://www.openstreetmap.org/wiki/Key:>\nPREFIX osm2rdf: <https://osm2rdf.cs.uni-freiburg.de/rdf#>\nSELECT ?country ?admin_level ?area ?geom WHERE {\n  ?country osmkey:admin_level ?admin_level .\n  ?country rdf:type osm:relation .                                                                                                                                                                                 \n  ?country osmkey:name ?name . \n  ?country osm2rdf:area ?area . \n  ?country geo:hasGeometry/geo:asWKT ?geom . \n  ?country osmkey:start_date ?start_date .                                                              \n  ?country osmkey:end_date ?end_date .   \n  VALUES ?date { \"1900-01-01\"^^xsd:date } \n FILTER(REGEX(STR(?start_date), \"^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$\"))\n FILTER(REGEX(STR(?end_date), \"^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$\"))\n FILTER (?date >= xsd:date(?start_date) && ?date <= xsd:date(?end_date))                                                                                                                                          \n}",
  "layers" : [
    {
        "id" : "1",
        "name" : "?geom in rot",
        "geomfield" : "?geom",
        "color" : "FF0000",
        "style" : "objects"
    },
    {
        "name" : "?geom in grün",
        "geomfield" : "?geom",
        "color" : "00FF00",
        "style" : "objects"
    },
    {
        "name" : "?geom in blau",
        "geomfield" : "?geom",
        "color" : "0000FF",
        "style" : "objects"
    },
    {
        "name" : "?geom als heatmap (area, spectral)",
        "geomfield" : "?geom",
        "weightfield" : "?area",
        "colorscheme" : "spectral",
        "style" : "heatmap"
    },
    {
        "name" : "?geom als heatmap (area, spectralexp)",
        "geomfield" : "?geom",
        "weightfield" : "?area",
        "colorscheme" : "spectralexp",
        "style" : "heatmap"
    },
    {
        "name" : "?geom als heatmap (admin_level)",
        "geomfield" : "?geom",
        "weightfield" : "?admin_level",
        "colorscheme" : "YlOrRdexp",
        "style" : "heatmap"
    }
  ]
}
</textarea>

      <textarea class="config" id="config4" name="cfg" hidden disabled>
{
  "query": "PREFIX geo: <http://www.opengis.net/ont/geosparql#>\n\nSELECT ?osm_id ?hasgeometry WHERE {\n  VALUES ?osm_id {\n    <https://www.openhistoricalmap.org/relation/2692425>\n  }\n\n  ?osm_id geo:hasGeometry/geo:asWKT ?hasgeometry .\n}",

  "exportQuery": "PREFIX geo: <http://www.opengis.net/ont/geosparql#>\nPREFIX osmkey: <https://www.openstreetmap.org/wiki/Key:>\n\nSELECT ?osm_id ?a ?b ?hasgeometry WHERE {\n  VALUES ?osm_id {\n    <https://www.openhistoricalmap.org/relation/2692425>\n  }\n\n  ?osm_id geo:hasGeometry/geo:asWKT ?hasgeometry .\n  ?osm_id ?a ?b .\n\n  FILTER(STRSTARTS(STR(?a), STR(osmkey:)) && ?a != osmkey:type)\n}\nORDER BY ?osm_id",

  "sourcePrimitivesExportQuery": "SELECT ?primitive_type ?primitive_id WHERE { VALUES (?primitive_type ?primitive_id) { (\"relation\" 2692425) } }",

  "fixedSourceTsvExportQuery": "PREFIX osm: <https://www.openstreetmap.org/>\nPREFIX osmway: <https://www.openstreetmap.org/way/>\nPREFIX osmrel: <https://www.openstreetmap.org/relation/>\nPREFIX geo: <http://www.opengis.net/ont/geosparql#>\nPREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\nPREFIX xsd: <http://www.w3.org/2001/XMLSchema#>\nPREFIX ql: <http://qlever.cs.uni-freiburg.de/builtin-functions/>\nPREFIX osmmeta: <https://www.openstreetmap.org/meta/>\n\nSELECT DISTINCT ?record_kind ?osm_type ?osm_id ?sequence ?tag_key ?tag_value ?node_ref ?member_type ?member_ref ?member_role ?lon ?lat ?version ?timestamp ?changeset ?uid ?user WHERE {\n  {\n    VALUES ?relation { <https://www.openhistoricalmap.org/relation/2692425> }\n    ?relation osmrel:member/osmrel:member_id ?way .\n    ?way rdf:type osm:way ; osmway:member/osmway:member_id ?node .\n    ?node rdf:type osm:node ; geo:hasGeometry/geo:asWKT ?wkt .\n    OPTIONAL { ?node osmmeta:version ?version . }\n    OPTIONAL { ?node osmmeta:timestamp ?timestamp . }\n    OPTIONAL { ?node osmmeta:changeset ?changeset . }\n    OPTIONAL { ?node osmmeta:uid ?uid . }\n    OPTIONAL { ?node osmmeta:user ?user . }\n\n    BIND(\"object\" AS ?record_kind)\n    BIND(\"node\" AS ?osm_type)\n    BIND(xsd:integer(STRAFTER(STR(?node), \"/node/\")) AS ?osm_id)\n    BIND(0 AS ?type_rank)\n    BIND(0 AS ?record_rank)\n    BIND(REPLACE(STR(?wkt), \"^POINT\\\\(([-+0-9.eE]+) [-+0-9.eE]+\\\\)$\", \"$1\") AS ?lon)\n    BIND(REPLACE(STR(?wkt), \"^POINT\\\\([-+0-9.eE]+ ([-+0-9.eE]+)\\\\)$\", \"$1\") AS ?lat)\n  }\n  UNION\n  {\n    VALUES ?relation { <https://www.openhistoricalmap.org/relation/2692425> }\n    ?relation osmrel:member ?relation_member .\n    ?relation_member osmrel:member_id ?node .\n    ?node rdf:type osm:node ; geo:hasGeometry/geo:asWKT ?wkt .\n    OPTIONAL { ?node osmmeta:version ?version . }\n    OPTIONAL { ?node osmmeta:timestamp ?timestamp . }\n    OPTIONAL { ?node osmmeta:changeset ?changeset . }\n    OPTIONAL { ?node   <script>
    // only the config of the active tab is part of the form data
    function showTab(i) {
      document.querySelectorAll('.tabs button').forEach((tab, j) => {
        tab.classList.toggle('active', i === j);
      });

      document.querySelectorAll('textarea.config').forEach((area, j) => {
        area.hidden = i !== j;
        area.disabled = i !== j;
      });
    }

    function submitForm() {
      const form = document.getElementsByTagName('form')[0];
      const method = document.querySelector('input[name="method"]:checked').value;

      if (method === 'GET') {
        let pars = new URLSearchParams(new FormData(form));
        pars.delete("method");
        window.open('.' + '?' + pars.toString(), "_blank");
      } else {
        const tempForm = document.createElement('form');
        tempForm.method = 'POST';
        tempForm.action = '.';

        const formData = new FormData(form);
        formData.forEach((value, key) => {
          if (key !== 'method') {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = value;
            tempForm.appendChild(input);
          }
        });

        document.body.appendChild(tempForm);
        tempForm.target = "_blank";
        tempForm.submit();
      }
    }
  </script>
